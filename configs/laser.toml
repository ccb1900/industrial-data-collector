# ========================================================================
# 激光加工机本机日志采集（res/laser 真实数据）— 四层声明模型
#
# 目录形状：res/laser/202609/<前缀>_YYMMDD.log —— 月份目录 + 两位年份
# 文件名内嵌日期；GB18030 编码，CRLF 行尾，首行表头。
# 15 种格式 = 15 个源（1 台虚拟机台 × 15 格式），各自独立入库表。
# 列全部 TEXT 原样落库（199 列显式声明，按表头名精确匹配）；
# 不声明 columns 时按表头自动映射。
#
# 跨平台书写：\ 与 / 都按分隔符统一（Windows 全 \，mac/Linux 全 /）。
# 相对路径锚定：相对本配置文件所在目录解析，与启动方式无关。
# ========================================================================

bundles = ["collector-core", "collector-console"]

[defaults]
state_dir = "../state"
date_policy = "yesterday"
catchup_days = 31
batch_size = 1000

[[sinks]]
name = "laser-sqlite"
driver = "sqlite"
dsn = "../state/collect.db"
file_table = "laser_files"
lazy_connect = true

# Oracle 中心库：go-ora 驱动的 URL 格式
# oracle://user:password@host:port/serviceName
[[sinks]]
name = "plant-oracle"
driver = "oracle"
dsn = "oracle://system:oracle@127.0.0.1:49161/XE"
file_table = "laser_files"
lazy_connect = true

# SQL Server（可选）：go-mssqldb 驱动。URL 格式
# sqlserver://user:pass@host:port?database=name
# [[sinks]]
# name = "plant-mssql"
# driver = "sqlserver"
# dsn = "sqlserver://sa:YourPass@127.0.0.1:1433?database=laser"
# lazy_connect = true

[[machines]]
no = "laser"
path = "../res/laser/YYYYMM"
group = "laser-set"
schedule = "nightly"                 # 该机台按 nightly 节奏自动采集
since = "2026-09-01"

[[schedules]]
name = "nightly"
cron = "23 3 * * *"

[[format_groups]]
name = "laser-set"
formats = ["aaa", "aaa_gosa", "alm_log", "cnd_selct", "length", "m307", "m370", "m377", "mainte1", "mask_gosa", "pwr", "sin_statis", "sinsyuku", "table", "zaxis"]

[[formats]]
name = "aaa"
match = "aaa_YYMMDD.log"
table = "laser_aaa"
sink = "plant-oracle"
columns = [
  { name = "日期", column = "biz_date", type = "text" },
  { name = "时间", column = "biz_time", type = "text" },
  { name = "Stage", column = "stage", type = "text" },
  { name = "识别结果 X", column = "result_x", type = "text" },
  { name = "识别结果 Y", column = "result_y", type = "text" },
  { name = "工件坐标 X", column = "workpiece_x", type = "text" },
  { name = "工件坐标 Y", column = "workpiece_y", type = "text" },
  { name = "主程序的程序编号", column = "main_prog_no", type = "text" },
  { name = "主程序的序列编号", column = "main_prog_seq", type = "text" },
  { name = "主程序的程序块编号", column = "main_prog_block", type = "text" },
  { name = "子程序的程序编号", column = "sub_prog_no", type = "text" },
  { name = "子程序的序列编号", column = "sub_prog_seq", type = "text" },
  { name = "子程序的程序块编号", column = "sub_prog_block", type = "text" },
  { name = "机械坐标 X", column = "machine_x", type = "text" },
  { name = "机械坐标 Y", column = "machine_y", type = "text" },
  { name = "尺寸", column = "size", type = "text" },
  { name = "Score", column = "score", type = "text" },
]
[formats.parser]
encoding = "gb18030"
header = true
allow_ragged = true

