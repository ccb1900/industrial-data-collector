# ========================================================================
# 激光加工机本机日志采集 — 生产部署 0923（三陵 3/5/6 线，60 机台）
#
# 拓扑：sanling3 = 37 台 × 15 格式，sanling5 = 2 台 × 21 格式，
#       sanling6 = 21 台 × 22 格式 —— 共 60 机台 ≈ 1059 个源实例。
# 目录形状：\\<机台IP>\log\YYYYMM\<前缀>_YYMMDD.log —— 月份目录 +
#       两位年份文件名内嵌日期；GB18030 编码，CRLF 行尾，首行表头。
# 15 个公共格式显式声明 columns（三组表头并集，异名同义列映射到
#       同一库列）；5/6 组独有前缀列跨机台不一致，按表头自动映射。
# 调度：全部机台引用 nightly（每天 09:01），-once/常驻均可。
#
# ⚠ 两处机台 IP 疑点（按原样保留，投放前请核对现场）：
#   - 41# 指向 192.168.1.41 —— 邻居 40#/42# 是 .140/.142，疑为 .141 笔误
#   - 81# 与 1# 同指 192.168.1.101 —— 同机双号会重复采同一批文件
#
# 跨平台书写：\ 与 / 都按分隔符统一（Windows 全 \，mac/Linux 全 /）。
# 相对路径锚定：相对本配置文件所在目录解析，与启动方式无关。
# ========================================================================

bundles = ["collector-core", "collector-console"]

[defaults]
state_dir = "../state"
date_policy = "yesterday"
catchup_days = 31
batch_size = 1000
# file_stable_window_seconds 保持 0：采的是"昨天"的已完成日志，无读到
# 半截文件的风险；若改 today 策略必须配 >0。

# ---- 并发（本次新特性）----
# 千级源实例 + UNC 列目录是网络等待型瓶颈：源间并发让各机台的扫描
# 等待互相重叠。1059 源 ÷ 16 并行 ≈ 66 批，每批亚秒级 → 整轮分钟级。
# 上限受采集机网卡/会话数与 Oracle 侧共享池（32 会话）约束，勿超 32。
max_parallel_sources = 16
files_per_source = 1       # 每源每天 1 个文件，文件级并发无收益

# ---- 备份（本次新特性，严格语义：备份失败 = 采集失败，下轮重试）----
backup_dir = "../backup"   # 副本：<backup_dir>/<机台-格式>/<业务日>/<文件>
                           # 60 台 × 22 格式 × N 天，注意磁盘容量规划
backup_keep_days = 90

[[sinks]]
name = "laser-sqlite"
driver = "sqlite"
dsn = "../state/collect.db"
file_table = "laser_files"
lazy_connect = true

# Oracle 中心库：go-ora 驱动的 URL 格式
# oracle://user:password@host:port/serviceName
# 当前 name 沿用 plant-oracle 但 driver 是本地 sqlite 联调桩——切换真库时
# 只改本块（driver/dsn），格式清单无需变动（sink 与语义解耦的意义所在）。
[[sinks]]
name = "plant-oracle"
driver = "sqlite"
dsn = "../state/collect2.db"
file_table = "laser_files"
lazy_connect = true
#[[sinks]]
#name = "plant-oracle"
#driver = "oracle"
#dsn = "oracle://system:oracle@127.0.0.1:49161/XE"
#file_table = "laser_files"
#lazy_connect = true

# SQL Server（可选）：go-mssqldb 驱动。URL 格式
# sqlserver://user:pass@host:port?database=name
# [[sinks]]
# name = "plant-mssql"
# driver = "sqlserver"
# dsn = "sqlserver://sa:YourPass@127.0.0.1:1433?database=laser"
# lazy_connect = true

