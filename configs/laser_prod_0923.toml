[[schedules]]
name = "nightly"
cron = "01 9 * * *"        # 每天 09:01（分 时 日 月 周）
# 原 nightly2 与 nightly 同表达式且无机台引用，已删——如日后需要
# 双班错峰（如 "31 21 * * *"）再恢复此名字并在机台行引用。

# sanling3 = 15 个格式（columns 取三组表头并集，异名同义列映射到同一库列）
[[format_groups]]
name = "sanling3"
formats = ["aaa", "aaa_gosa", "alm_log", "cnd_selct", "length", "m307", "m370", "m377", "mainte1", "mask_gosa", "pwr", "sin_statis", "sinsyuku", "table", "zaxis"]
[[format_groups]]
name = "sanling5"
formats = ["aaa", "aaa_gosa", "alm_log", "cnd_selct", "length", "m307", "m370", "m377", "mainte1", "mask_gosa", "pwr", "sin_statis", "sinsyuku", "table", "zaxis", "energy_measure", "galv_mask_measure", "glv_cnd_send", "pc_direct", "proc_state", "sensor"]
[[format_groups]]
name = "sanling6"
formats = ["aaa", "aaa_gosa", "alm_log", "cnd_selct", "length", "m307", "m370", "m377", "mainte1", "mask_gosa", "pwr", "sin_statis", "sinsyuku", "table", "zaxis", "energy_measure", "galv_mask_measure", "glv_cnd_send", "pc_direct", "proc_state", "sensor", "twin_scale_dsp"]

[[formats]]
name = "aaa"
match = "aaa_YYMMDD.log"
table = "laser_aaa"
sink = "plant-oracle"
columns = [
  { name = "日期", column = "biz_date", type = "text" },
  { name = "时间", column = "biz_time", type = "text" },
  { name = "Stage", column = "stage", type = "text" },
  { name = "识别结果 X", column = "result_x", type = "text" },
  { name = "识别结果 Y", column = "result_y", type = "text" },
  { name = "工件坐标 X", column = "workpiece_x", type = "text" },
  { name = "工件坐标 Y", column = "workpiece_y", type = "text" },
  { name = "主程序的程序编号", column = "main_prog_no", type = "text" },
  { name = "主程序的序列编号", column = "main_prog_seq", type = "text" },
  { name = "主程序的程序块编号", column = "main_prog_block", type = "text" },
  { name = "子程序的程序编号", column = "sub_prog_no", type = "text" },
  { name = "子程序的序列编号", column = "sub_prog_seq", type = "text" },
  { name = "子程序的程序块编号", column = "sub_prog_block", type = "text" },
  { name = "机械坐标 X", column = "machine_x", type = "text" },
  { name = "机械坐标 Y", column = "machine_y", type = "text" },
  { name = "尺寸", column = "size", type = "text" },
  { name = "Score", column = "score", type = "text" },
  { name = "相关比率", column = "corr_ratio", type = "text" },
  { name = "Lack Rate", column = "lack_rate", type = "text" },
  { name = "加工程序", column = "prog_path", type = "text" },
]
[formats.parser]
encoding = "gb18030"
header = true
allow_ragged = true

[[formats]]
name = "aaa_gosa"
match = "aaaGosa_YYMMDD.log"
table = "laser_aaa_gosa"
sink = "plant-oracle"
columns = [
