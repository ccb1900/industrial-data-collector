# Host csv-line-a — CSV date-directory collection into the shared database.

[profiles.csv_line]
parser = "csv"
header = true
pattern = "*.csv"
file_stable_window_seconds = 30
date_policy = "yesterday"
catchup_days = 3
batch_size = 5000

[profiles.pg_sink]
storage = "postgresql-storage"
driver = "pgx"
dsn = "postgres://user:pass@db-host:5432/industrial"
table = "line_a_records"
lazy_connect = true

[profiles.file_state]
state_type = "file-state"
state_dir = "./state"

[[sources]]
id = "csv-line-a-main"
path = "//line-a-host/export"
profiles = ["csv_line", "pg_sink", "file_state"]

[sources.metadata]
plant = "A"
line = "01"

[[components]]
id = "daily"
type = "scheduler"

[components.config]
schedule = "daily"
time = "01:30"

[[components]]
id = "query-provider"
type = "query-provider"

[[components]]
id = "console-bridge"
type = "console-bridge"

[[components]]
id = "ui"
type = "ui"

[components.config]
host_id = "csv-line-a"

[components.config.fleet]
peers = ["http://gauge-l1:8080", "http://csv-line-b:8080"]
