# Desktop configuration: composition-shape demo (profiles + sources).
# Single-machine demo with typed relational sink (pure-Go SQLite) and the
# full console (pages/panels contributed by independent components).

[profiles.csv_machine]
parser = "csv"
header = true
pattern = "*.csv"
file_stable_window_seconds = 0
date_policy = "specific"
specific_date = "2026-09-08"
batch_size = 1000

[profiles.typed_sqlite]
storage = "sqlite-storage"
driver = "sqlite"
dsn = "state/collect.db"
table = "readings"
file_table = "source_files"
expose_console = true
lazy_connect = true

[[profiles.typed_sqlite.columns]]
from = "csv"
name = "ts"
column = "ts"
type = "timestamp"
required = true

[[profiles.typed_sqlite.columns]]
from = "csv"
name = "temperature"
column = "temperature"
type = "float"

[[profiles.typed_sqlite.columns]]
from = "csv"
name = "unit"
column = "unit"
type = "text"

[[profiles.typed_sqlite.columns]]
from = "metadata"
name = "product"
column = "product"
type = "text"

[[sources]]
id = "production-source"
path = "./data/production"
profiles = ["csv_machine", "typed_sqlite"]

[sources.metadata]
plant = "demo"

[[sources.path_metadata]]
name = "product"
from = "filename"
pattern = "{product}.csv"
required = true

[[components]]
id = "scheduler"
type = "scheduler"

[components.config]
schedule = "daily"
time = "02:00"

[[components]]
id = "console-bridge"
type = "console-bridge"

[[components]]
id = "console-rows"
type = "console-rows"

[[components]]
id = "query-provider"
type = "query-provider"

[[components]]
id = "ui"
type = "ui"

[[components]]
id = "ui-page-overview"
type = "ui-page"

[components.config]
page_id = "overview"
title = "概览"
route = "/overview"
renderer = "dashboard"
order = 0

[[components]]
id = "ui-page-collections"
type = "ui-page"

[components.config]
page_id = "collections"
title = "采集任务"
route = "/collections"
renderer = "collections"
order = 10

[[components]]
id = "ui-page-files"
type = "ui-page"

[components.config]
page_id = "files"
title = "文件"
route = "/files"
renderer = "files"
order = 20

[[components]]
id = "ui-page-sources"
type = "ui-page"

[components.config]
page_id = "sources"
title = "数据源"
route = "/sources"
renderer = "sources"
order = 30

[[components]]
id = "ui-page-data"
type = "ui-page"

[components.config]
page_id = "data"
title = "数据查询"
route = "/data"
renderer = "data-explorer"
order = 35

[[components]]
id = "ui-panel-logs"
type = "ui-panel"

[components.config]
panel_id = "logs"
pages = ["overview"]
title = "日志"
position = "bottom"
renderer = "logs"
order = 25

[[components]]
id = "ui-panel-metadata"
type = "ui-panel"

[components.config]
panel_id = "metadata"
pages = ["files"]
title = "元数据"
position = "right"
renderer = "metadata"
order = 10

[[components]]
id = "ui-panel-event-feed"
type = "ui-panel"

[components.config]
panel_id = "event-feed"
pages = ["overview", "collections"]
title = "事件流"
position = "bottom"
renderer = "event-feed"
order = 20

[[components]]
id = "ui-panel-failures"
type = "ui-panel"

[components.config]
panel_id = "failures"
pages = ["overview", "collections"]
title = "失败账本"
position = "bottom"
renderer = "failures"
order = 30

# Plugin Explorer is itself an ordinary plugin: it contributes this Console
# page and exposes Runtime inspection/control through the application bridge.
[[components]]
id = "plugin-explorer"
type = "plugin-explorer"

[components.config]
page_id = "plugins"
title = "插件"
route = "/plugins"
order = 40
