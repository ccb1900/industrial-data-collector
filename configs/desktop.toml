# Desktop (Wails) configuration for cmd/collector-ui.
# UI commands (TriggerCollection) drive the Collector through the
# CollectionRequested Runtime Event; a Scheduler component is optional.

[[components]]
id = "production-source"
type = "local-file-source"

[components.config]
root = "./data/production"
pattern = "*.csv"
file_stable_window_seconds = 0

[[components]]
id = "csv-parser"
type = "csv-parser"

[components.config]
header = true

[[components]]
id = "memory-storage"
type = "memory-storage"

[[components]]
id = "collection-state"
type = "memory-state"

[[components]]
id = "production-metadata"
type = "path-metadata"

[components.config]

[[components.config.sources]]
source = "production-source"
root = "./data/production"

[[components.config.sources.metadata]]
name = "product"
from = "filename"
pattern = "{product}.csv"
required = true

[[components]]
id = "production-collector"
type = "csv-collector"

[components.config]
source = "production-source"
parser = "csv-parser"
storage = "memory-storage"
state = "collection-state"
date_policy = "yesterday"
batch_size = 1000

[[components]]
id = "query-provider"
type = "query-provider"

[[components]]
id = "ui"
type = "ui"

# UI Composition: pages and panels are contributed by independent components.
# The UI Host does not know which business plugin contributed them.
[[components]]
id = "ui-page-collections"
type = "ui-page"

[components.config]
page_id = "collections"
title = "Collections"
route = "/collections"
renderer = "collections"

[[components]]
id = "ui-page-files"
type = "ui-page"

[components.config]
page_id = "files"
title = "Files"
route = "/files"
renderer = "files"

[[components]]
id = "ui-page-sources"
type = "ui-page"

[components.config]
page_id = "sources"
title = "Sources"
route = "/sources"
renderer = "sources"

[[components]]
id = "ui-panel-metadata"
type = "ui-panel"

[components.config]
panel_id = "metadata"
title = "Metadata"
position = "right"
renderer = "metadata"

[[components]]
id = "ui-panel-event-feed"
type = "ui-panel"

[components.config]
panel_id = "event-feed"
title = "Latest Events"
position = "bottom"
renderer = "event-feed"
