# Desktop 配置：组合形态演示（四层声明模型）。
# 部署无关的组合在命名 bundle（app/bundles）里；本文件声明本部署的
# 四层清单：defaults / sink / 格式 / 格式清单组 / 机台。
#
#   --dump-config（与 effective-config 查询）打印展开后的有效树。
# NOTE: 顶层键必须先于一切表（TOML 语义），保持在本文件靠前位置。
bundles = ["collector-core", "collector-console"]

# 调度：以机台为对象。机台行 schedule 引用调度名，不同机台不同节奏。
[[schedules]]
name = "frequent"
cron = "0 */6 * * *"

[[schedules]]
name = "weekly"
cron = "0 4 * * 0"

[defaults]
state_dir = "../state"
date_policy = "yesterday"
catchup_days = 7
batch_size = 1000
file_stable_window_seconds = 0

[[sinks]]
name = "demo-sqlite"
driver = "sqlite"
dsn = "../state/collect.db"
file_table = "source_files"
lazy_connect = true

# ===== 格式清单：一类数据文件 = 一张表的契约 =====

# readings：日期目录 + 任意命名 CSV（日期在目录段，match 无日期记号
# → 目录发现模式）；列显式声明（timestamp/float 类型列演示）。
[[formats]]
name = "readings"
match = "*.csv"
table = "readings"
sink = "demo-sqlite"
columns = [
  { from = "csv", name = "ts", column = "ts", type = "timestamp", required = true },
  { from = "csv", name = "temperature", column = "temperature", type = "float" },
  { from = "csv", name = "unit", column = "unit", type = "text" },
  { from = "metadata", name = "product", column = "product", type = "text" },
]
metadata = [
  { name = "product", from = "filename", pattern = "{product}.csv", required = true },
]

# legacy-dat：同目录不同格式的分工演示——*.dat（GBK 历史导出）与
# *.csv 以模式分属两个格式；行入库后以 source_id 列区分。
[[formats]]
name = "legacy-dat"
match = "*.dat"
table = "legacy_readings"
sink = "demo-sqlite"
[formats.parser]
encoding = "gbk"
header = true
columns = [
  { from = "csv", name = "ts", column = "ts", type = "timestamp", required = true },
  { from = "csv", name = "temperature", column = "temperature", type = "float" },
  { from = "csv", name = "unit", column = "unit", type = "text" },
  { from = "metadata", name = "product", column = "product", type = "text" },
]
metadata = [
  { name = "product", from = "filename", pattern = "{product}.dat", required = true },
]

# ===== 格式清单组：机台的采集范围 =====

[[format_groups]]
name = "demo-csv-set"
formats = ["readings"]

[[format_groups]]
name = "demo-dat-set"
formats = ["legacy-dat"]

# ===== 机台清单：目录即机台（演示）=====

[[machines]]
no = "production"
path = "data/production/YYYY-MM-DD"
group = "demo-csv-set"
schedule = "frequent"
[machines.metadata]
plant = "demo"

[[machines]]
no = "quality"
path = "data/quality/YYYY-MM-DD"
group = "demo-csv-set"
schedule = "frequent"
[machines.metadata]
plant = "demo"

[[machines]]
no = "legacy"
path = "data/production/YYYY-MM-DD"
group = "demo-dat-set"
schedule = "weekly"
[machines.metadata]
plant = "demo"
