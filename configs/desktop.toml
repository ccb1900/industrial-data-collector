# Desktop configuration: composition-shape demo.
# The deployment-independent composition lives in named bundles (app/bundle):
#   collector-core     — scheduler, console bridge/rows, query provider, ui,
#                        plugin explorer (the runtime backbone)
#   collector-console  — the standard pages/panels as declarative view stacks
# This file declares what is specific to THIS deployment: shared profiles
# and sources. An explicit [[components]] row replaces the bundle row with
# the same id wholesale — e.g. to retune the schedule:
#
#   [[components]]
#   id = "scheduler"
#   type = "scheduler"
#
#   [components.config]
#   cron = "0 */6 * * *"        # every 6 hours; cron 与 schedule/time 二选一
#
# `--dump-config` (and the "effective-config" hub query) prints the expanded
# effective tree — what actually runs, patches applied.
# NOTE: top-level keys must precede every table in TOML — keep this line here.
bundles = ["collector-core", "collector-console"]

# 报警示例插件不再在此声明：plugins/alarm-demo/manifest.toml 由框架自
# 发现并生成组件行（进程外后端 + 前端模块 + 页面），同样受组合治理。

# 与生产配置一致：默认采集昨天；catchup_days 在停机/缺勤后
# 第一次触发最多回看 7 天补齐缺口，已成功的批次因幂等写入不会重复。
[profiles.csv_machine]
parser = "csv"
header = true
pattern = "*.csv"
file_stable_window_seconds = 0
date_policy = "yesterday"
catchup_days = 7
batch_size = 1000

# 遗留导出的独立入库表：不同格式的文件写到不同的表。
[profiles.legacy_sink]
storage = "sqlite-storage"
driver = "sqlite"
dsn = "state/collect.db"
table = "legacy_readings"
expose_console = true
lazy_connect = true

[[profiles.legacy_sink.columns]]
from = "csv"
name = "ts"
column = "ts"
type = "timestamp"
required = true

[[profiles.legacy_sink.columns]]
from = "csv"
name = "temperature"
column = "temperature"
type = "float"

[[profiles.legacy_sink.columns]]
from = "csv"
name = "unit"
column = "unit"
type = "text"

[[profiles.legacy_sink.columns]]
from = "metadata"
name = "product"
column = "product"
type = "text"

[profiles.typed_sqlite]
storage = "sqlite-storage"
driver = "sqlite"
dsn = "state/collect.db"
table = "readings"
file_table = "source_files"
expose_console = true
lazy_connect = true

[[profiles.typed_sqlite.columns]]
from = "csv"
name = "ts"
column = "ts"
type = "timestamp"
required = true

[[profiles.typed_sqlite.columns]]
from = "csv"
name = "temperature"
column = "temperature"
type = "float"

[[profiles.typed_sqlite.columns]]
from = "csv"
name = "unit"
column = "unit"
type = "text"

[[profiles.typed_sqlite.columns]]
from = "metadata"
name = "product"
column = "product"
type = "text"

# 多源同格式：任意多个 source 复用同一组 profiles（同格式、同入库表），
# 各自展开为独立的 source-unit 组件——独立目录、独立补采链、可单独卸载；
# 行入库后以 source_id 列区分。
[[sources]]
id = "production-source"
path = "./data/production"
profiles = ["csv_machine", "typed_sqlite"]

[sources.metadata]
plant = "demo"

[[sources.path_metadata]]
name = "product"
from = "filename"
pattern = "{product}.csv"
required = true

# 同目录不同格式：legacy-source 与 production-source 共享 ./data/production，
# 以模式分工——*.dat（GBK 编码的历史导出）归 legacy-source，*.csv 归
# production-source；行入库后以 source_id 区分。注意：共目录时不要与
# detect_content = true 的源混用（内容探测会无视扩展名认领所有文件）。
[profiles.legacy_machine]
parser = "csv"
header = true
pattern = "*.dat"
encoding = "gbk"
file_stable_window_seconds = 0
date_policy = "yesterday"
catchup_days = 7
batch_size = 1000

[[sources]]
id = "legacy-source"
path = "./data/production"
profiles = ["legacy_machine", "legacy_sink"]

[[sources.path_metadata]]
name = "product"
from = "filename"
pattern = "{product}.dat"
required = true

[[sources]]
id = "quality-source"
path = "./data/quality"
profiles = ["csv_machine", "typed_sqlite"]

[[sources.path_metadata]]
name = "product"
from = "filename"
pattern = "{product}.csv"
required = true
