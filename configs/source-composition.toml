# Source Configuration Composition demo: two similar machines share one CSV
# profile and one sink profile, while each source remains an independent
# Runtime unit with its own file-state namespace below ./state/<source_id>.
#
# Run:
#   go run ./cmd/csv-collector -config configs/source-composition.toml
#   go run ./cmd/web-ui -config configs/source-composition.toml

[profiles.csv_machine]
parser = "csv"
header = true
pattern = "*.csv"
file_stable_window_seconds = 0
date_policy = "yesterday"
batch_size = 1000

[profiles.memory_sink]
sink = "memory-storage"

[profiles.file_state]
state_type = "file-state"
state_dir = "./state"

[[sources]]
id = "machine001"
path = "./data/machine001"
profiles = ["csv_machine", "memory_sink", "file_state"]

[sources.metadata]
plant = "A"
line = "01"
machine = "001"

[[sources]]
id = "machine002"
path = "./data/machine002"
profiles = ["csv_machine", "memory_sink", "file_state"]

[sources.metadata]
plant = "A"
line = "02"
machine = "002"

[[components]]
id = "daily-scheduler"
type = "scheduler"

[components.config]
schedule = "daily"
time = "02:00"

[[components]]
id = "query-provider"
type = "query-provider"

[[components]]
id = "console-bridge"
type = "console-bridge"

[[components]]
id = "ui"
type = "ui"

# UI Composition: pages and panels are contributed by independent components.
[[components]]
id = "ui-page-collections"
type = "ui-page"

[components.config]
page_id = "collections"
title = "Collections"
route = "/collections"
renderer = "collections"
order = 10

[[components]]
id = "ui-page-files"
type = "ui-page"

[components.config]
page_id = "files"
title = "Files"
route = "/files"
renderer = "files"
order = 20

[[components]]
id = "ui-page-sources"
type = "ui-page"

[components.config]
page_id = "sources"
title = "Sources"
route = "/sources"
renderer = "sources"
order = 30

[[components]]
id = "ui-panel-metadata"
type = "ui-panel"

[components.config]
panel_id = "metadata"
title = "Metadata"
position = "right"
renderer = "metadata"
order = 10

[[components]]
id = "ui-panel-event-feed"
type = "ui-panel"

[components.config]
panel_id = "event-feed"
title = "Latest Events"
position = "bottom"
renderer = "event-feed"
order = 20

[[components]]
id = "ui-panel-failures"
type = "ui-panel"

[components.config]
panel_id = "failures"
title = "Failure Ledger"
position = "bottom"
renderer = "failures"
order = 30
