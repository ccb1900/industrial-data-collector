[[components]]
id = "remote-source"
type = "unc-file-source"

[components.config]
root = "\\\\192.168.1.100\\production\\data"
pattern = "*.csv"
file_stable_window_seconds = 30


[[components]]
id = "csv-parser"
type = "csv-parser"

[components.config]
header = true


[[components]]
id = "postgres-storage"
type = "postgresql-storage"

[components.config]
driver = "pgx"
dsn = "postgres://user:password@127.0.0.1:5432/gocordis"
table = "gocordis_records"


[[components]]
id = "collection-state"
type = "file-state"

[components.config]
path = "./state/collection-state.json"


[[components]]
id = "scheduler"
type = "scheduler"

[components.config]
schedule = "daily"
time = "02:00"


[[components]]
id = "production-collector"
type = "csv-collector"

[components.config]
source = "remote-source"
parser = "csv-parser"
storage = "postgres-storage"
state = "collection-state"
date_policy = "yesterday"
batch_size = 1000
