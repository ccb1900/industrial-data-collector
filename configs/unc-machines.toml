# ----------------------------------------------------------------
# 机台清单：唯一一份 ip ↔ 机台号 对应表
# 加机台 = 加一行；删机台 = 删一行
# ----------------------------------------------------------------
[[machines]]
ip = "192.168.1.100"
no = "MT-001"

[[machines]]
ip = "192.168.1.101"
no = "MT-002"

[[machines]]
ip = "192.168.1.102"
no = "MT-003"

# ----------------------------------------------------------------
# 格式展开：每种格式 × 每台机台 → 一个源组件
# {ip} 替换为清单中的 ip；YYYYMM/YYYYMMDD 翻译为实际日期路径
# ----------------------------------------------------------------
[[machine_formats]]
path_template = '\\\\{ip}\logs'
profiles = ["log_a"]
id_suffix = "a"

[[machine_formats]]
path_template = '\\\\{ip}\logs'
profiles = ["log_b"]
id_suffix = "b"

[[machine_formats]]
path_template = '\\\\{ip}\logs'
profiles = ["log_c"]
id_suffix = "c"

# ----------------------------------------------------------------
# 调度：所有机台统一每日采集（按 date_policy 确定目标日期）
# 不同组需要不同时刻时，加多条 schedules 并给机台打 group 标签
# ----------------------------------------------------------------
[[components]]
id = "scheduler"
type = "scheduler"

[components.config]
cron = "23 3 * * *"

# ----------------------------------------------------------------
# 控制台组件（预设：概览/采集任务/数据源/数据查询/插件 六页）
# ----------------------------------------------------------------
