# ========================================================================
# UNC 多机台日志采集 → Oracle
#
# 目录形状（每台机台一个共享，日志按月分目录、文件名内嵌日期）：
#   \\192.168.1.100\logs\202609\a_20260908.log
#   \\192.168.1.100\logs\202609\a_20260909.log
#   \\192.168.1.101\logs\202609\a_20260908.log
#   ...
#
# 三种格式 = 三个源（每机台 × 每格式）；机台号随每行写入 Oracle。
# 加机台只需在 [[machines]] 追加一行 ip + no。
# 列声明可选：不写时系统从 CSV 表头自动发现列名并建列（TEXT）。
#
# 跨平台书写：路径里的 \ 与 / 都按分隔符处理，组合前统一为主机原生风格
# （Windows 全 \，mac/Linux 全 /），不会因 \ / 混搭而"文件不存在"。
# UNC 共享只在 Windows 上直接可达；mac/Linux 联调时把共享挂载到本机，
# 将 path_template 改写为挂载点（如 /Volumes/logs 或 /mnt/logs）即可，
# 分隔符风格随意。
# ========================================================================

# ----------------------------------------------------------------
# 共享画像：a 格式日志
# ----------------------------------------------------------------

bundles = ["collector-core", "collector-console"]
[profiles.log_a]
parser = "csv"
header = true
pattern = "a_*.log"
date_dir_layout = "YYYYMM"
filename_date_layout = "a_YYYYMMDD.log"
date_policy = "yesterday"
catchup_days = 7
batch_size = 1000
state_type = "file-state"
state_dir = "./state"
storage = "oracle-storage"
driver = "oracle"
dsn = "oracle://system:oracle@127.0.0.1:49161/XE"
table = "LOGS_A"
expose_console = true
lazy_connect = true

# ----------------------------------------------------------------
# 共享画像：b 格式日志
# ----------------------------------------------------------------
[profiles.log_b]
parser = "csv"
header = true
pattern = "b_*.log"
date_dir_layout = "YYYYMM"
filename_date_layout = "b_YYYYMMDD.log"
date_policy = "yesterday"
catchup_days = 7
batch_size = 1000
state_type = "file-state"
state_dir = "./state"
storage = "oracle-storage"
driver = "oracle"
dsn = "oracle://system:oracle@127.0.0.1:49161/XE"
table = "LOGS_B"
expose_console = true
lazy_connect = true

# ----------------------------------------------------------------
# 共享画像：c 格式日志
# ----------------------------------------------------------------
[profiles.log_c]
parser = "csv"
header = true
pattern = "c_*.log"
date_dir_layout = "YYYYMM"
filename_date_layout = "c_YYYYMMDD.log"
date_policy = "yesterday"
catchup_days = 7
batch_size = 1000
state_type = "file-state"
state_dir = "./state"
storage = "oracle-storage"
driver = "oracle"
dsn = "oracle://system:oracle@127.0.0.1:49161/XE"
table = "LOGS_C"
expose_console = true
lazy_connect = true

# ----------------------------------------------------------------
# 机台清单：唯一一份 ip ↔ 机台号 对应表
# 加机台 = 加一行；删机台 = 删一行
# ----------------------------------------------------------------
[[machines]]
ip = "192.168.1.100"
no = "MT-001"

[[machines]]
ip = "192.168.1.101"
no = "MT-002"

[[machines]]
ip = "192.168.1.102"
no = "MT-003"

# ----------------------------------------------------------------
# 格式展开：每种格式 × 每台机台 → 一个源组件
# ----------------------------------------------------------------
[[machine_formats]]
path_template = '\\{ip}\logs'
profiles = ["log_a"]
id_suffix = "a"

[[machine_formats]]
path_template = '\\{ip}\logs'
profiles = ["log_b"]
id_suffix = "b"

[[machine_formats]]
path_template = '\\{ip}\logs'
profiles = ["log_c"]
id_suffix = "c"

# ----------------------------------------------------------------
# 调度：所有机台统一每日采集
# ----------------------------------------------------------------
[[components]]
id = "scheduler"
type = "scheduler"

[components.config]
cron = "23 3 * * *"

# ----------------------------------------------------------------
# 控制台组件（预设：概览/采集任务/数据源/数据查询/插件 六页）
# ----------------------------------------------------------------
