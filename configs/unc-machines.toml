# ========================================================================
# UNC 多机台日志采集 → Oracle（四层声明模型）
#
# 目录形状（每台机台一个共享，日志按月分目录、文件名内嵌日期）：
#   \\192.168.1.100\logs\202609\a_20260908.log
#
# 加机台 = [[machines]] 加一行；加格式 = [[formats]] 加一段。
# 机台号随每行写入 Oracle（machine_no 列）；表按格式区分（LOGS_A/B/C）。
#
# 跨平台书写：\ 与 / 都按分隔符统一（Windows 全 \，mac/Linux 全 /）。
# 相对路径锚定：相对本配置文件所在目录解析，与启动方式无关。
# ========================================================================

bundles = ["collector-core", "collector-console"]

[defaults]
state_dir = "../state"
date_policy = "yesterday"
catchup_days = 31
batch_size = 1000

[[sinks]]
name = "plant-oracle"
driver = "oracle"
dsn = "oracle://system:oracle@127.0.0.1:49161/XE"
file_table = "plant_files"
lazy_connect = true

[[formats]]
name = "log-a"
match = "a_YYYYMMDD.log"
table = "LOGS_A"
sink = "plant-oracle"

[[formats]]
name = "log-b"
match = "b_YYYYMMDD.log"
table = "LOGS_B"
sink = "plant-oracle"

[[formats]]
name = "log-c"
match = "c_YYYYMMDD.log"
table = "LOGS_C"
sink = "plant-oracle"

[[format_groups]]
name = "unc-set"
formats = ["log-a", "log-b", "log-c"]

# 机台清单：since = 投产日下界（按台可不同）
[[machines]]
no = "MT-001"
ip = "192.168.1.100"
path = '\\{ip}\\logs\\YYYYMM'
group = "unc-set"
since = "2026-09-01"

[[machines]]
no = "MT-002"
ip = "192.168.1.101"
path = '\\{ip}\\logs\\YYYYMM'
group = "unc-set"
since = "2026-09-01"

[[machines]]
no = "MT-003"
ip = "192.168.1.102"
path = '\\{ip}\\logs\\YYYYMM'
group = "unc-set"
since = "2026-09-01"

[[schedules]]
cron = "23 3 * * *"
group = "unc-set"
