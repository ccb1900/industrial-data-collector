# ========================================================================
# UNC 多机台日志采集 → Oracle
#
# 目录形状（每台机台一个共享，日志按月分目录、文件名内嵌日期）：
#   \\192.168.1.100\logs\202609\a_20260908.log
#   \\192.168.1.100\logs\202609\a_20260909.log
#   \\192.168.1.101\logs\202609\a_20260908.log
#   ...
#
# 三种格式 = 三个源（每机台 × 每格式）；机台号随每行写入 Oracle。
# ========================================================================

# ----------------------------------------------------------------
# 共享画像：机台 A 组日志（a_*.log）
# 列按实际 CSV 表头改；type 可选 timestamp/float/text/int/bigint/bool/date
# ----------------------------------------------------------------
bundles = ["collector-core", "collector-console"]

[profiles.log_a]
parser = "csv"
header = true
pattern = "a_*.log"
date_dir_layout = "YYYYMM"
filename_date_layout = "a_YYYYMMDD.log"
date_policy = "yesterday"
catchup_days = 7
batch_size = 1000
state_type = "file-state"
state_dir = "./state"
storage = "oracle-storage"
driver = "oracle"
dsn = "oracle://system:oracle@127.0.0.1:49161/XE"
table = "LOGS_A"
expose_console = true
lazy_connect = true

[[profiles.log_a.columns]]
from = "csv"
name = "ts"
column = "timestamp"
type = "timestamp"
required = true

[[profiles.log_a.columns]]
from = "csv"
name = "temperature"
column = "temperature"
type = "float"

[[profiles.log_a.columns]]
from = "csv"
name = "pressure"
column = "pressure"
type = "float"

[[profiles.log_a.columns]]
from = "metadata"
name = "machine_no"
column = "machine_no"
type = "text"

# ----------------------------------------------------------------
# 共享画像：b 格式日志（b_*.log）
# ----------------------------------------------------------------
[profiles.log_b]
parser = "csv"
header = true
pattern = "b_*.log"
date_dir_layout = "YYYYMM"
filename_date_layout = "b_YYYYMMDD.log"
date_policy = "yesterday"
catchup_days = 7
batch_size = 1000
state_type = "file-state"
state_dir = "./state"
storage = "oracle-storage"
driver = "oracle"
dsn = "oracle://system:oracle@127.0.0.1:49161/XE"
table = "LOGS_B"
expose_console = true
lazy_connect = true

[[profiles.log_b.columns]]
from = "csv"
name = "ts"
column = "event_time"
type = "timestamp"
required = true

[[profiles.log_b.columns]]
from = "csv"
name = "event_type"
column = "event_type"
type = "text"

[[profiles.log_b.columns]]
from = "csv"
name = "duration_ms"
column = "duration_ms"
type = "int"

[[profiles.log_b.columns]]
from = "metadata"
name = "machine_no"
column = "machine_no"
type = "text"

