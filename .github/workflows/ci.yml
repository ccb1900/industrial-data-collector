name: ci

on:
  push:
  pull_request:

env:
  # 框架依赖永远指向刚推送的提交（bump-cordis.sh）：模块代理对新鲜伪版本有
  # 传播延迟与偶发 stream error（NEW-02 验证期间的 CI 三连败即此），直连 git
  # 拉取绕过代理与 sumdb。
  GOPRIVATE: 'github.com/ccb1900/*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './plugins/*/vendor/*'))
          if [ -n "$unformatted" ]; then echo "gofmt required:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # NEW: surface every failure-ish line as a check annotation
            grep -nE "FAIL|panic|cannot|missing|stream error|exit status" /tmp/test.log | head -40 | while IFS= read -r line; do
              echo "::error::${line:0:200}"
            done
            exit 1
          fi
      - name: Race (core paths)
        run: go test -race ./app/... ./components/... ./internal/... ./tests/...

  plugin-module:
    # plugins/alarm-demo 是独立 module：根目录 go test ./... 不覆盖它。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Plugin module build
        working-directory: plugins/alarm-demo
        run: go build ./...
      - name: Plugin module vet
        working-directory: plugins/alarm-demo
        run: go vet ./...
      - name: Plugin module test
        working-directory: plugins/alarm-demo
        run: go test ./...
